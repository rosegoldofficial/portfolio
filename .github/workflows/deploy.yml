name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 23:05 UTC = 00:05 w Polsce zimą (01:05 latem). Codzienny build publikuje porady z dzisiejszą datą.
    - cron: '5 23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 24
        env:
          # Remove SITE_BASE and SITE_URL once mikolajborawski.pl is connected (public/CNAME).
          SITE_BASE: /portfolio
          SITE_URL: https://rosegoldofficial.github.io
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
